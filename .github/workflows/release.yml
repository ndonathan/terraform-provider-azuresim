name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  update-registry:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
        continue-on-error: true
        id: checkout_ghpages

      - name: Create gh-pages branch if it does not exist
        if: steps.checkout_ghpages.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          git commit --allow-empty -m "Initialize gh-pages"
          git push origin gh-pages

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p /tmp/release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "terraform-provider-azuresim_${VERSION}_SHA256SUMS" \
            --dir /tmp/release

      - name: Extract GPG key ID
        id: gpg
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          KEY_ID=$(echo "$GPG_PUBLIC_KEY" | gpg --with-colons --import-options show-only --import 2>/dev/null | awk -F: '/^pub:/{print $5}')
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Generate registry files
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          PROVIDER="azuresim"
          NAMESPACE="ndonathan"
          REPO="${GITHUB_REPOSITORY}"
          BASE_DIR="v1/providers/${NAMESPACE}/${PROVIDER}"
          CHECKSUMS="/tmp/release/terraform-provider-${PROVIDER}_${VERSION}_SHA256SUMS"

          # Ensure service discovery exists
          mkdir -p .well-known
          cat > .well-known/terraform.json <<'EOF'
          {"providers.v1":"/v1/providers/"}
          EOF

          # Disable Jekyll
          touch .nojekyll

          # JSON-encode the GPG public key (newlines become \n)
          GPG_KEY_JSON=$(echo "$GPG_PUBLIC_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

          # Generate per-platform download files
          while IFS='  ' read -r shasum filename; do
            # Skip non-zip lines (e.g. manifest)
            case "$filename" in
              *.zip) ;;
              *) continue ;;
            esac

            # Extract os and arch from filename
            # Format: terraform-provider-azuresim_0.1.0_linux_amd64.zip
            stripped="${filename%.zip}"
            os_arch="${stripped#terraform-provider-${PROVIDER}_${VERSION}_}"
            os="${os_arch%%_*}"
            arch="${os_arch#*_}"

            DOWNLOAD_DIR="${BASE_DIR}/${VERSION}/download/${os}"
            mkdir -p "$DOWNLOAD_DIR"

            cat > "${DOWNLOAD_DIR}/${arch}" <<ENDJSON
          {
            "protocols": ["6.0"],
            "os": "${os}",
            "arch": "${arch}",
            "filename": "${filename}",
            "download_url": "https://github.com/${REPO}/releases/download/${TAG}/${filename}",
            "shasums_url": "https://github.com/${REPO}/releases/download/${TAG}/terraform-provider-${PROVIDER}_${VERSION}_SHA256SUMS",
            "shasums_signature_url": "https://github.com/${REPO}/releases/download/${TAG}/terraform-provider-${PROVIDER}_${VERSION}_SHA256SUMS.sig",
            "shasum": "${shasum}",
            "signing_keys": {
              "gpg_public_keys": [
                {
                  "key_id": "${GPG_KEY_ID}",
                  "ascii_armor": ${GPG_KEY_JSON}
                }
              ]
            }
          }
          ENDJSON
          done < "$CHECKSUMS"

          # Rebuild the cumulative versions index
          VERSIONS_FILE="${BASE_DIR}/versions"
          {
            echo '{"versions":['
            FIRST=true
            for version_dir in "${BASE_DIR}"/*/; do
              v="$(basename "$version_dir")"
              # Skip if not a version directory
              [ ! -d "${version_dir}download" ] && continue

              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                printf ','
              fi

              # Build platforms list
              printf '{"version":"%s","protocols":["6.0"],"platforms":[' "$v"
              FIRST_PLAT=true
              for os_dir in "${version_dir}download"/*/; do
                os="$(basename "$os_dir")"
                for arch_file in "${os_dir}"*; do
                  arch="$(basename "$arch_file")"
                  if [ "$FIRST_PLAT" = true ]; then
                    FIRST_PLAT=false
                  else
                    printf ','
                  fi
                  printf '{"os":"%s","arch":"%s"}' "$os" "$arch"
                done
              done
              echo ']}'
            done
            echo ']}'
          } > "$VERSIONS_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update registry for ${{ steps.version.outputs.tag }}"
          git push
